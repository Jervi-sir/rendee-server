# HTTPS Server Block
server {
    listen 443 ssl http2;
    server_name rendee.app www.rendee.app for-mobile.rendee.app;

    # Allow Let's Encrypt SSL renewals but block other hidden files
    location ^~ /.well-known/acme-challenge/ {
        allow all;
    }
    location ~* ^/.well-known/ {
        return 403;
    }

    location / {
        proxy_pass http://localhost:18040;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }

    # SSL Certificates generated by Certbot
    ssl_certificate /etc/letsencrypt/live/rendee.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rendee.app/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

# HTTP to HTTPS Redirect
server {
    listen 80;
    server_name rendee.app www.rendee.app for-mobile.rendee.app;

    location ^~ /.well-known/acme-challenge/ {
        allow all;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
